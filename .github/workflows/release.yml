name: Build & Release

# A push to main publishes a downloadable release using the version in
# Directory.Build.props (the same version stamped into the binary and shown in
# Settings, so dev builds and releases always match). Bump that version to cut
# a new release; a push whose version was already released just builds and
# validates without republishing. Doc-only changes are ignored. You can also
# trigger a build manually from the Actions tab via "Run workflow".
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # sign the build provenance attestation
      attestations: write   # write the build provenance attestation
    # Signing turns on automatically once the AZURE_* secrets exist; until then
    # the sign step is skipped and unsigned builds are published as before.
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = ([string]$props.Project.PropertyGroup.Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "No <Version> found in Directory.Build.props"; exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Hot Corners $version"

          # Only publish when this version has not been released yet, so a push
          # that does not bump the version never overwrites or duplicates a release.
          $null = gh release view "v$version" 2>&1
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            Write-Host "Release v$version already exists; building without publishing."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          exit 0

      # The tray app and the WinUI 3 settings app publish separately:
      # the tray (WinForms) goes to publish/win-<arch>/ as a single-file exe, and
      # the settings app (WinUI 3, which can't be single-file) goes to a Settings
      # subfolder so Inno Setup's recursive copy lands it at {app}\Settings\.
      # Self-contained WindowsAppSDK bundles ~100 MB of AI/ML runtime DLLs that
      # the settings UI never calls, so we delete them after publish; this drops
      # the installer from ~200 MB to ~60 MB.
      - name: Publish win-x64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish HotCorners.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=embedded `
            -p:Version=$v -o publish/win-x64
          dotnet publish HotCorners.Settings/HotCorners.Settings.csproj -c Release -r win-x64 `
            -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-x64/Settings
          Get-ChildItem publish/win-x64/Settings -Recurse -File -Include `
            'onnxruntime*.dll','Microsoft.AI.MachineLearning*.dll','DirectML*.dll' |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Publish win-arm64
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish HotCorners.csproj -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=embedded `
            -p:Version=$v -o publish/win-arm64
          dotnet publish HotCorners.Settings/HotCorners.Settings.csproj -c Release -r win-arm64 `
            -p:Platform=arm64 --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:Version=$v -o publish/win-arm64/Settings
          Get-ChildItem publish/win-arm64/Settings -Recurse -File -Include `
            'onnxruntime*.dll','Microsoft.AI.MachineLearning*.dll','DirectML*.dll' |
            Remove-Item -Force -ErrorAction SilentlyContinue

      # Code-sign the launched binaries with Azure Trusted Signing (now "Azure
      # Artifact Signing") so Windows SmartScreen stops warning on download and
      # launch-at-login. Skipped automatically until the AZURE_* secrets and the
      # TRUSTED_SIGNING_* repo variables are configured. Signs before packaging so
      # the installers wrap signed files. Reputation builds over time; the warning
      # clears once enough clean installs accrue against this identity.
      - name: Sign binaries (Azure Trusted Signing)
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Build a Windows installer per architecture from the publish output. ISCC ships on
      # windows-latest; install it on the fly if a future runner image drops it.
      - name: Build installers
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -EA SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -EA SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC (Inno Setup) not found" }
          foreach ($arch in 'x64','arm64') {
            & "$iscc" "/DAppVersion=$v" "/DArch=$arch" "/DSourceDir=$env:GITHUB_WORKSPACE\publish\win-$arch" "/O$env:GITHUB_WORKSPACE" "installer\HotCorners.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $arch" }
          }
          Get-ChildItem HotCornersSetup-*.exe | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      # Sign the installer executables so the file users actually double-click is signed.
      - name: Sign installers (Azure Trusted Signing)
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # SHA-256 checksums so users can verify their downloads.
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash HotCornersSetup-*.exe -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Signed SLSA build provenance: lets anyone verify a release artifact was built by
      # this repository's CI from this commit, with
      # `gh attestation verify <file> --repo bwya77/Windows-Hot-Corners`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: |
            HotCornersSetup-*.exe

      # Also attach the provenance bundle as a release asset so the provenance is
      # discoverable on the release itself, not only in the attestations store.
      - name: Stage provenance bundle
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" "HotCorners-${{ steps.ver.outputs.version }}.intoto.jsonl"

      - name: Create GitHub Release
        if: steps.ver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Hot Corners v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            HotCornersSetup-*.exe
            SHA256SUMS.txt
            HotCorners-*.intoto.jsonl
