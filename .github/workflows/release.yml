name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.0) — only used for manual runs'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [ win-x64, win-arm64 ]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/',''
          } else {
            '${{ github.event.inputs.tag }}'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag"

      - name: Publish self-contained (${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:PublishReadyToRun=${{ matrix.rid == 'win-x64' }} `
            -o publish\${{ matrix.rid }}

      - name: Rename exe with arch suffix
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.rid }}' -eq 'win-x64') { 'x64' } else { 'arm64' }
          $src = "publish\${{ matrix.rid }}\HotCorners.exe"
          $dst = "publish\${{ matrix.rid }}\HotCorners-$arch.exe"
          Move-Item $src $dst
          $size = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "$dst  ($size MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotCorners-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/HotCorners-*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -name 'HotCorners-*.exe' -exec cp {} out/ \;
          ls -la out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Hot Corners ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: out/HotCorners-*.exe
